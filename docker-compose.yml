services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent_console}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_console}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Windows 下 bind-mount 把宿主目录映射为容器内 root:755，非 root 进程无法在其下写入
    # 桥接任务目录（data/bridges）。本地开发环境以 root 运行后端以规避该挂载权限限制。
    # 生产部署应移除此项并改用 named volume（宿主客户端改走 API 读取任务目录）。
    user: "0:0"
    # 该 environment 块被 worker 服务以 YAML anchor 复用，改这里两边同步生效。
    environment: &backend-env
      APP_NAME: ${APP_NAME:-Agent Console API}
      APP_ENV: ${APP_ENV:-development}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000", "http://127.0.0.1:3000"]}
      APP_API_TOKEN: ${APP_API_TOKEN:-}
      AGENT_TOOLS_ENABLED: ${AGENT_TOOLS_ENABLED:-true}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+asyncpg://agent:agent@db:5432/agent_console}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/0}
      # C-170：任务默认入持久化队列由独立 worker 消费；置 inline 可回退到 API 进程内执行
      TASK_EXECUTION_MODE: ${TASK_EXECUTION_MODE:-queue}
      # C-170：跨实例事件总线与分布式锁；置 false 可回退到单实例进程内广播
      EVENT_BUS_ENABLED: ${EVENT_BUS_ENABLED:-true}
      DISTRIBUTED_LOCK_ENABLED: ${DISTRIBUTED_LOCK_ENABLED:-true}
      LITELLM_DEFAULT_MODEL: ${LITELLM_DEFAULT_MODEL:-}
      MODELS_CONFIG_PATH: /app/config/models.yaml
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-60}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - ./data/bridges:/app/data/bridges
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # 数据库迁移由该一次性服务独占执行（置于 backend 之后以复用 *backend-env 锚点）。
  # 此前 backend 与 worker 各自在启动时跑 alembic upgrade head，两容器并发迁移
  # 同一库会产生 "table already exists" 竞争崩溃（2026-08-29 容器实跑发现）。
  # backend/worker 内的 init_db 保留为幂等空转，standalone 场景（start-local.bat）仍可用。
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "0:0"
    environment: *backend-env
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # C-170：独立 Worker 进程，消费 task_queue_items 持久化队列。
  # 此前 app/worker.py 已实现但无任何编排入口启动，Phase 2 的调度链路从未真正运行。
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "0:0"
    environment: *backend-env
    command: ["python", "-m", "app.worker"]
    volumes:
      - backend_data:/app/data
      - ./data/bridges:/app/data/bridges
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  redis_data:
  postgres_data:
