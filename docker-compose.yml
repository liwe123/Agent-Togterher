services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Windows 下 bind-mount 把宿主目录映射为容器内 root:755，非 root 进程无法在其下写入
    # 桥接任务目录（data/bridges）。本地开发环境以 root 运行后端以规避该挂载权限限制。
    # 生产部署应移除此项并改用 named volume（宿主客户端改走 API 读取任务目录）。
    user: "0:0"
    environment:
      APP_NAME: ${APP_NAME:-Agent Console API}
      APP_ENV: ${APP_ENV:-development}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000", "http://127.0.0.1:3000"]}
      APP_API_TOKEN: ${APP_API_TOKEN:-}
      AGENT_TOOLS_ENABLED: ${AGENT_TOOLS_ENABLED:-true}
      DATABASE_URL: sqlite+aiosqlite:///./data/agent_console.db
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/0}
      LITELLM_DEFAULT_MODEL: ${LITELLM_DEFAULT_MODEL:-}
      MODELS_CONFIG_PATH: /app/config/models.yaml
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-60}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - ./data/bridges:/app/data/bridges
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  redis_data:
