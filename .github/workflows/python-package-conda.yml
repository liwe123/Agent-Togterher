name: Python Package Tests

on:
  push:
  pull_request:
  # 依赖漂移探针：每周一 03:17 UTC 用未锁定的区间依赖跑一遍，提前暴露
  # 上游发版导致的假红，而不是等下次 push 才在 build-linux 上撞见。
  schedule:
    - cron: '17 3 * * 1'
  # 手动触发：想立刻验证当前区间最新依赖是否仍兼容时使用。
  workflow_dispatch:

env:
  # 让 pytest 进度实时落日志：进程被取消时也能看到最后完成的用例位置。
  PYTHONUNBUFFERED: "1"
  # 测试进展停滞 >90s 即 dump 线程栈 + asyncio 任务栈并退出（先于 pytest-timeout
  # 的 120s 单测超时触发，定位“退出阶段后台任务取消卡住”这类挂起）。
  PYTEST_WATCHDOG_SECONDS: "90"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # 防 6 小时挂死：超过 20 分钟直接失败并保留日志。
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # -c constraints.txt：把区间依赖收敛到已验证版本，防上游发版假红
          # （run 41269487154：pytest 9.2.0 + pytest-asyncio 1.4.1 触发
          #  PytestDeprecationWarning，被 filterwarnings=error 升为 INTERNALERROR）。
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Lint with flake8
        run: |
          pip install -c constraints.txt flake8
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # 2026-10-01 P2-4：去掉 --exit-zero，第二遍成为真门禁（存量 79 项违规
          # 已清零；11 处存量 C901 复杂度债以行内 noqa 显式豁免，重构另行立项）。
          flake8 app tests --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: sqlite+aiosqlite:///./agent_console_ci.db
        run: |
          # -s 关闭 fd 捕获，看门狗/pytest-timeout 的 dump 才能落到 CI 日志；
          # --timeout 单测上限，--session-timeout 兜住收集/夹具阶段挂起。
          pytest -q -s --timeout=120 --timeout-method=thread --session-timeout=900

  # 20260907 报告 OPT-2/A3：SQLite 内存库只能证明逻辑正确，无法覆盖真实
  # PostgreSQL 方言行为（JSON、索引、并发写）。本 job 用 service container
  # 起 PG16 + Redis7 实跑同一套测试；conftest 用 setdefault 显式传 env 即可
  # 覆盖，不需（也不允许）改 conftest。EVENT_BUS_ENABLED 不显式传，保持
  # conftest 默认 false（总线专项另立项）。
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_console_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # -c constraints.txt：把区间依赖收敛到已验证版本，防上游发版假红
          # （run 41269487154：pytest 9.2.0 + pytest-asyncio 1.4.1 触发
          #  PytestDeprecationWarning，被 filterwarnings=error 升为 INTERNALERROR）。
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Lint with flake8
        run: |
          pip install -c constraints.txt flake8
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test with pytest on PostgreSQL
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agent_console_ci
        run: |
          pytest -q -s --timeout=120 --timeout-method=thread --session-timeout=900

  # 20260907 报告 OPT-2/A3：前端质量门禁入 CI。
  # 2026-10-01 P2-4 补齐：首期只有 lint + test，类型安全与页面编译无门禁
  # （load-ts-module.mjs 用 transpileModule，不做类型检查），故追加 typecheck
  # 与 build 两步；本地 npm run build 与之等价。
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
  # 依赖漂移探针：唯一一个“故意不锁定”的 job。
  # 只接受 schedule / workflow_dispatch 触发（push、PR 上被 if 直接跳过），
  # 因此即使上游发版把它打红，也不会改变 push 的构建结论——它只负责提前
  # 预警 requirements 的区间依赖已经不兼容，给更新 constraints.txt 留窗口。
  # 判定标准刻意保持最小：装得上 + app.main 能 import + 测试能收集。
  # 不跑全量 pytest（那是 build-linux 的职责），探针要足够快才有人看。
  dependency-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies without constraints
        run: |
          python -m pip install --upgrade pip
          # 关键：刻意不带 -c constraints.txt，装的是 requirements 区间的当前最新版。
          pip install -r requirements-dev.txt
          echo "--- 本次实际解析到的关键版本 ---"
          python -m pip list --format=freeze | grep -iE '^(pytest|pytest-asyncio|pytest-timeout|fastapi|sqlalchemy|pydantic|litellm|anyio|starlette)==' || true

      - name: Smoke import app.main
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -c "import app.main"

      - name: Collect tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: sqlite+aiosqlite:///./agent_console_canary.db
        run: pytest -q --collect-only tests
