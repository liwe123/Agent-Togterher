name: Python Package Tests

on:
  push:
  pull_request:

env:
  # 让 pytest 进度实时落日志：进程被取消时也能看到最后完成的用例位置。
  PYTHONUNBUFFERED: "1"
  # 测试进展停滞 >90s 即 dump 线程栈 + asyncio 任务栈并退出（先于 pytest-timeout
  # 的 120s 单测超时触发，定位“退出阶段后台任务取消卡住”这类挂起）。
  PYTEST_WATCHDOG_SECONDS: "90"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # 防 6 小时挂死：超过 20 分钟直接失败并保留日志。
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: sqlite+aiosqlite:///./agent_console_ci.db
        run: |
          # -s 关闭 fd 捕获，看门狗/pytest-timeout 的 dump 才能落到 CI 日志；
          # --timeout 单测上限，--session-timeout 兜住收集/夹具阶段挂起。
          pytest -q -s --timeout=120 --timeout-method=thread --session-timeout=900

  # 20260907 报告 OPT-2/A3：SQLite 内存库只能证明逻辑正确，无法覆盖真实
  # PostgreSQL 方言行为（JSON、索引、并发写）。本 job 用 service container
  # 起 PG16 + Redis7 实跑同一套测试；conftest 用 setdefault 显式传 env 即可
  # 覆盖，不需（也不允许）改 conftest。EVENT_BUS_ENABLED 不显式传，保持
  # conftest 默认 false（总线专项另立项）。
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_console_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test with pytest on PostgreSQL
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agent_console_ci
        run: |
          pytest -q -s --timeout=120 --timeout-method=thread --session-timeout=900

  # 20260907 报告 OPT-2/A3：前端质量门禁（lint + 单测）入 CI。
  # build 耗时长，首期 lint + test；页面编译由本地 npm run build 门禁保障。
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
