<svg viewBox="0 0 1240 756" width="1240" height="756" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text {
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2DD4BF"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A78BFA"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Outer Dark Canvas -->
  <rect x="0" y="0" width="1240" height="756" rx="14" fill="#0B0F17" stroke="#1E293B" stroke-width="2"/>

  <!-- Header Bar -->
  <text x="28" y="42" font-size="20" font-weight="700" fill="#F8FAFC" letter-spacing="0.4">Agent Console · 系统核心组件图与数据流拓扑</text>
  <text x="1212" y="42" text-anchor="end" font-size="12.5" font-weight="500" fill="#94A3B8">控制面与执行面解耦 · 四路确定性编排 · 原子租约容错 · 全链路可观测治理</text>
  <line x1="24" y1="58" x2="1216" y2="58" stroke="#1E293B" stroke-width="2"/>

  <!-- ==================== 4 DOMAIN ZONES ==================== -->
  <!-- Zone 1: Client & External Nodes (x=24..236, w=212) -->
  <rect x="24" y="76" width="212" height="608" rx="12" fill="#0F172A" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="130" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#60A5FA">[Client] 客户端与外部节点域</text>

  <!-- Zone 2: FastAPI Access & Gateway (x=292..524, w=232) -->
  <rect x="292" y="76" width="232" height="608" rx="12" fill="#0D1B22" stroke="#0D9488" stroke-width="1.5"/>
  <text x="408" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#2DD4BF">[API] FastAPI 接入与网关域 (:8000)</text>

  <!-- Zone 3: Orchestration, Workflow & Bridge Core (x=580..968, w=388) -->
  <rect x="580" y="76" width="388" height="608" rx="12" fill="#151329" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="774" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#A78BFA">[Core &amp; Bridge] 任务编排、工作流与桥接核心域</text>

  <!-- Zone 4: Runtime, Storage & LLM Providers (x=1024..1216, w=192) -->
  <rect x="1024" y="76" width="192" height="608" rx="12" fill="#1C1611" stroke="#D97706" stroke-width="1.5"/>
  <text x="1120" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#FBBF24">[Data] 运行时与数据模型域</text>

  <!-- ==================== ROW 1 (y=120..212, center y=166) ==================== -->
  <!-- Z1: Web Console -->
  <rect x="38" y="120" width="184" height="92" rx="8" fill="#162238" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="130" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#93C5FD">Web Console 前端</text>
  <text x="130" y="168" text-anchor="middle" font-size="11" fill="#E2E8F0">Next.js 16 · React 19 (:3000)</text>
  <text x="130" y="188" text-anchor="middle" font-size="11" fill="#94A3B8">四栏工作台 / 群聊 / 回放 / DAG</text>

  <!-- Z2: REST API -->
  <rect x="306" y="120" width="204" height="92" rx="8" fill="#112A32" stroke="#14B8A6" stroke-width="1.8"/>
  <text x="408" y="143" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5EEAD4">REST API 路由与中间件</text>
  <text x="408" y="163" text-anchor="middle" font-size="11" fill="#E2E8F0">JWT / API Token 双轨鉴权</text>
  <text x="408" y="181" text-anchor="middle" font-size="11" fill="#94A3B8">4 级 RBAC · QuotaService 熔断</text>
  <text x="408" y="199" text-anchor="middle" font-size="11" fill="#94A3B8">AuditService · Redaction 脱敏</text>

  <!-- Z3a: MessageHub -->
  <rect x="594" y="120" width="170" height="92" rx="8" fill="#1F1B3A" stroke="#8B5CF6" stroke-width="1.8"/>
  <text x="679" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C4B5FD">MessageHub</text>
  <text x="679" y="168" text-anchor="middle" font-size="11" fill="#E2E8F0">消息落库与 @Agent 解析</text>
  <text x="679" y="188" text-anchor="middle" font-size="11" fill="#94A3B8">单任务 / 接力链 / 外部路由</text>

  <!-- Z3b: TaskService & Lease -->
  <rect x="784" y="120" width="170" height="92" rx="8" fill="#1F1B3A" stroke="#8B5CF6" stroke-width="1.8"/>
  <text x="869" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C4B5FD">TaskService &amp; Lease</text>
  <text x="869" y="168" text-anchor="middle" font-size="11" fill="#E2E8F0">六态状态机流转控制</text>
  <text x="869" y="188" text-anchor="middle" font-size="11" fill="#94A3B8">持久化入队与原子租约</text>

  <!-- Z4: Worker -->
  <rect x="1036" y="120" width="168" height="92" rx="8" fill="#291F14" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="1120" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#FCD34D">独立 Worker 进程集群</text>
  <text x="1120" y="168" text-anchor="middle" font-size="10.5" fill="#E2E8F0">轮询 task_queue_items 认领</text>
  <text x="1120" y="188" text-anchor="middle" font-size="10.5" fill="#94A3B8">30s 续租心跳 · 60s 孤儿回收</text>

  <!-- ==================== ROW 2 (y=252..348, center y=300) ==================== -->
  <!-- Z2: WebSocket Manager -->
  <rect x="306" y="252" width="204" height="96" rx="8" fill="#112A32" stroke="#14B8A6" stroke-width="1.8"/>
  <text x="408" y="280" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5EEAD4">WebSocket Manager</text>
  <text x="408" y="302" text-anchor="middle" font-size="11" fill="#E2E8F0">工作区连接池与初始状态快照</text>
  <text x="408" y="322" text-anchor="middle" font-size="11" fill="#94A3B8">实时推送 step / relay / status</text>

  <!-- Z3: AgentOrchestrator -->
  <rect x="594" y="252" width="360" height="96" rx="8" fill="#1F1B3A" stroke="#8B5CF6" stroke-width="1.8"/>
  <text x="774" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C4B5FD">AgentOrchestrator 多智能体编排器</text>
  <text x="774" y="297" text-anchor="middle" font-size="11" fill="#E2E8F0">① Manager 拆解 → Worker 并发/串行 → QA 验收 → Final 汇总</text>
  <text x="774" y="316" text-anchor="middle" font-size="11" fill="#CBD5E1">② 群聊多 @ 顺序接力链（逐棒上下文传递 + [PASS] 静默让位）</text>
  <text x="774" y="335" text-anchor="middle" font-size="11" fill="#94A3B8">③ ExecutionTrace 结构化轨迹拼装与超长上下文摘要裁剪</text>

  <!-- Z4: PostgreSQL / SQLite -->
  <rect x="1036" y="252" width="168" height="96" rx="8" fill="#291F14" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="1120" y="276" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FCD34D">PostgreSQL 16 / SQLite</text>
  <text x="1120" y="297" text-anchor="middle" font-size="10.5" fill="#E2E8F0">21 张核心领域表（事实源）</text>
  <text x="1120" y="316" text-anchor="middle" font-size="10.5" fill="#CBD5E1">tasks / task_steps / model_calls</text>
  <text x="1120" y="335" text-anchor="middle" font-size="10.5" fill="#94A3B8">audit_logs / workflow_runs ...</text>

  <!-- ==================== ROW 3 (y=388..490, center y=438) ==================== -->
  <!-- Z1: 第三方 Webhook 接收端 -->
  <rect x="38" y="392" width="184" height="92" rx="8" fill="#162238" stroke="#64748B" stroke-width="1.6"/>
  <text x="130" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#E2E8F0">第三方 Webhook 接收端</text>
  <text x="130" y="442" text-anchor="middle" font-size="11" fill="#CBD5E1">飞书告警 / GitHub PR 回调</text>
  <text x="130" y="462" text-anchor="middle" font-size="11" fill="#94A3B8">HMAC-SHA256 签名校验</text>

  <!-- Z2: Webhook 服务与插件中心 -->
  <rect x="306" y="392" width="204" height="92" rx="8" fill="#112A32" stroke="#14B8A6" stroke-width="1.6"/>
  <text x="408" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#5EEAD4">Webhook 服务与插件中心</text>
  <text x="408" y="442" text-anchor="middle" font-size="11" fill="#E2E8F0">JSON Manifest 工具热挂载</text>
  <text x="408" y="462" text-anchor="middle" font-size="11" fill="#94A3B8">任务终态 Fan-out 3 次重试通知</text>

  <!-- Z3a: DAGEngine -->
  <rect x="594" y="392" width="170" height="92" rx="8" fill="#1F1B3A" stroke="#8B5CF6" stroke-width="1.6"/>
  <text x="679" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#C4B5FD">DAGEngine 工作流</text>
  <text x="679" y="442" text-anchor="middle" font-size="11" fill="#E2E8F0">Kahn 拓扑分层并行执行</text>
  <text x="679" y="462" text-anchor="middle" font-size="11" fill="#94A3B8">HITL 人工审批挂起与恢复</text>

  <!-- Z3b: Tool & LiteLLM -->
  <rect x="784" y="392" width="170" height="92" rx="8" fill="#1F1B3A" stroke="#8B5CF6" stroke-width="1.6"/>
  <text x="869" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#C4B5FD">Tool &amp; LiteLLM 网关</text>
  <text x="869" y="442" text-anchor="middle" font-size="11" fill="#E2E8F0">最多 5 轮工具调用闭环</text>
  <text x="869" y="462" text-anchor="middle" font-size="11" fill="#94A3B8">多模型槽位与 Fallback 降级</text>

  <!-- Z4: 云端 LLM 模型供应商 -->
  <rect x="1036" y="386" width="168" height="104" rx="8" fill="#1E293B" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="1120" y="410" text-anchor="middle" font-size="12.5" font-weight="700" fill="#93C5FD">云端 LLM 模型供应商</text>
  <text x="1120" y="431" text-anchor="middle" font-size="10.5" fill="#E2E8F0">• DeepSeek (deepseek-chat)</text>
  <text x="1120" y="448" text-anchor="middle" font-size="10.5" fill="#CBD5E1">• OpenAI (gpt-4.1 / mini)</text>
  <text x="1120" y="465" text-anchor="middle" font-size="10.5" fill="#CBD5E1">• Anthropic (claude-3.5)</text>
  <text x="1120" y="482" text-anchor="middle" font-size="10.5" fill="#94A3B8">• Gemini / 阿里通义 Qwen</text>

  <!-- ==================== ROW 4 (y=536..634, center y=585) ==================== -->
  <!-- Z1: 外部软件 Agent 集群 -->
  <rect x="38" y="540" width="184" height="90" rx="8" fill="#162238" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="130" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#93C5FD">外部软件 Agent 集群</text>
  <text x="130" y="590" text-anchor="middle" font-size="11" fill="#E2E8F0">Cursor IDE · Codex CLI</text>
  <text x="130" y="610" text-anchor="middle" font-size="11" fill="#94A3B8">Trae · Antigravity 节点</text>

  <!-- Z2: IntegrationService -->
  <rect x="306" y="540" width="204" height="90" rx="8" fill="#112A32" stroke="#14B8A6" stroke-width="1.6"/>
  <text x="408" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#5EEAD4">IntegrationService</text>
  <text x="408" y="590" text-anchor="middle" font-size="11" fill="#E2E8F0">外部节点注册 · 心跳监控</text>
  <text x="408" y="610" text-anchor="middle" font-size="11" fill="#94A3B8">能力匹配与最小负载节点选择</text>

  <!-- Z3: BaseBridge -->
  <rect x="594" y="536" width="360" height="98" rx="8" fill="#1F1B3A" stroke="#8B5CF6" stroke-width="1.6"/>
  <text x="774" y="560" text-anchor="middle" font-size="13" font-weight="700" fill="#C4B5FD">BaseBridge 外部桥接适配层</text>
  <text x="774" y="581" text-anchor="middle" font-size="10.5" fill="#E2E8F0">CursorBridge (共享目录契约)  |  CodexBridge (CLI 沙箱子进程)</text>
  <text x="774" y="600" text-anchor="middle" font-size="10.5" fill="#CBD5E1">标准目录契约：PROMPT.md / task.json → output.md / events.jsonl</text>
  <text x="774" y="619" text-anchor="middle" font-size="10.5" fill="#94A3B8">22 项测试命令白名单校验（防命令注入）+ 产物自动采集回写</text>

  <!-- Z4: Redis 7 实例 -->
  <rect x="1036" y="540" width="168" height="90" rx="8" fill="#291F14" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="1120" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#FCD34D">Redis 7 实例</text>
  <text x="1120" y="590" text-anchor="middle" font-size="10.5" fill="#E2E8F0">跨进程 WebSocket Pub/Sub</text>
  <text x="1120" y="610" text-anchor="middle" font-size="10.5" fill="#94A3B8">分布式锁与滑动窗口限流</text>

  <!-- ==================== PLANAR ORTHOGONAL CONNECTIONS ==================== -->
  <!-- 1. Web Console -> REST API -->
  <line x1="222" y1="154" x2="304" y2="154" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="242" y="131" width="44" height="17" rx="4" fill="#0B0F17" stroke="#3B82F6" stroke-width="1"/>
  <text x="264" y="143" text-anchor="middle" font-size="10" fill="#60A5FA" font-weight="700">REST</text>

  <!-- 2. WebSocket Manager -> Web Console (Corridor 1-2 x=264) -->
  <path d="M 306 300 L 264 300 L 264 190 L 224 190" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-teal)"/>
  <rect x="238" y="236" width="52" height="18" rx="4" fill="#0B0F17" stroke="#14B8A6" stroke-width="1"/>
  <text x="264" y="249" text-anchor="middle" font-size="10" fill="#2DD4BF" font-weight="700">WS 推送</text>

  <!-- 3. REST API -> MessageHub -> TaskService -> Worker -->
  <line x1="510" y1="166" x2="592" y2="166" stroke="#A78BFA" stroke-width="2" marker-end="url(#arr-purple)"/>
  <rect x="532" y="143" width="40" height="17" rx="4" fill="#0B0F17" stroke="#8B5CF6" stroke-width="1"/>
  <text x="552" y="155" text-anchor="middle" font-size="10" fill="#C4B5FD" font-weight="700">路由</text>

  <line x1="764" y1="166" x2="782" y2="166" stroke="#A78BFA" stroke-width="2" marker-end="url(#arr-purple)"/>

  <line x1="954" y1="166" x2="1034" y2="166" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="974" y="143" width="40" height="17" rx="4" fill="#0B0F17" stroke="#D97706" stroke-width="1"/>
  <text x="994" y="155" text-anchor="middle" font-size="10" fill="#FBBF24" font-weight="700">入队</text>

  <!-- 4. Worker -> AgentOrchestrator (Row 1-2 Gap y=232) -->
  <path d="M 1120 212 L 1120 232 L 890 232 L 890 250" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="966" y="223" width="60" height="18" rx="4" fill="#0B0F17" stroke="#D97706" stroke-width="1"/>
  <text x="996" y="236" text-anchor="middle" font-size="10" fill="#FBBF24" font-weight="700">认领消费</text>

  <!-- 5. AgentOrchestrator -> PostgreSQL -->
  <line x1="954" y1="300" x2="1034" y2="300" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="974" y="277" width="40" height="17" rx="4" fill="#0B0F17" stroke="#D97706" stroke-width="1"/>
  <text x="994" y="289" text-anchor="middle" font-size="10" fill="#FBBF24" font-weight="700">ORM</text>

  <!-- 6. AgentOrchestrator -> DAGEngine & Tool/LiteLLM -->
  <line x1="679" y1="348" x2="679" y2="390" stroke="#A78BFA" stroke-width="2" marker-end="url(#arr-purple)"/>
  <line x1="869" y1="348" x2="869" y2="390" stroke="#A78BFA" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- 7. Tool & LiteLLM -> 云端 LLM 模型供应商 -->
  <line x1="954" y1="438" x2="1034" y2="438" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="966" y="415" width="56" height="17" rx="4" fill="#0B0F17" stroke="#3B82F6" stroke-width="1"/>
  <text x="994" y="427" text-anchor="middle" font-size="10" fill="#60A5FA" font-weight="700">模型调用</text>

  <!-- 8. Webhook 服务与插件中心 -> 第三方 Webhook 接收端 -->
  <line x1="306" y1="438" x2="224" y2="438" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arr-teal)"/>
  <rect x="236" y="415" width="56" height="17" rx="4" fill="#0B0F17" stroke="#14B8A6" stroke-width="1"/>
  <text x="264" y="427" text-anchor="middle" font-size="10" fill="#2DD4BF" font-weight="700">签名推送</text>

  <!-- 9. Redis 7 -> WebSocket Manager (Row 3-4 Gap y=512 + Corridor 2-3 x=552) -->
  <path d="M 1036 572 L 996 572 L 996 512 L 552 512 L 552 300 L 512 300" fill="none" stroke="#2DD4BF" stroke-width="1.9" stroke-dasharray="5,3" marker-end="url(#arr-teal)"/>
  <rect x="684" y="503" width="180" height="18" rx="4" fill="#0B0F17" stroke="#14B8A6" stroke-width="1"/>
  <text x="774" y="516" text-anchor="middle" font-size="10" fill="#2DD4BF" font-weight="700">Redis Pub/Sub 跨进程事件广播</text>

  <!-- 10. IntegrationService -> BaseBridge -->
  <line x1="510" y1="585" x2="592" y2="585" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arr-teal)"/>
  <rect x="524" y="562" width="56" height="17" rx="4" fill="#0B0F17" stroke="#14B8A6" stroke-width="1"/>
  <text x="552" y="574" text-anchor="middle" font-size="10" fill="#2DD4BF" font-weight="700">节点派发</text>

  <!-- 11. BaseBridge -> 外部软件 Agent 集群 (Bottom Rail y=658 + Corridor 1-2 x=264) -->
  <path d="M 679 634 L 679 658 L 264 658 L 264 585 L 224 585" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="372" y="649" width="196" height="18" rx="4" fill="#0B0F17" stroke="#3B82F6" stroke-width="1"/>
  <text x="470" y="662" text-anchor="middle" font-size="10" fill="#60A5FA" font-weight="700">四文件目录契约 / CLI 沙箱进程调用</text>

  <!-- ==================== FOOTER LEGEND BAR ==================== -->
  <rect x="190" y="700" width="860" height="36" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="220" y="722" font-size="11.5" font-weight="600" fill="#60A5FA">━━▶ 同步 HTTP / CLI / 模型调用</text>
  <text x="430" y="722" font-size="11.5" font-weight="600" fill="#C4B5FD">━━▶ 内部编排与工作流调度</text>
  <text x="615" y="722" font-size="11.5" font-weight="600" fill="#FBBF24">━━▶ 异步队列认领与数据库持久化</text>
  <text x="835" y="722" font-size="11.5" font-weight="600" fill="#2DD4BF">╌╌▶ WebSocket / Redis 实时事件流</text>
</svg>
