[pytest]
# 本地与 CI 对齐（守则 3）：CI 显式传 --timeout=120 --timeout-method=thread
# --session-timeout=900，此处固化同参数，使裸跑 pytest 与 CI 行为一致。
timeout = 120
timeout_method = thread
session_timeout = 900
# 告警门禁：告警默认升级为错误，防止 “coroutine never awaited” 这类真实缺陷
# 再次静默通过——该门禁已实际抓到两处 AsyncMock 误用
# （tests/test_integrations.py、tests/test_codex_bridge.py）。
#
# 放行项一律精确到“第三方来源 + 具体对象”，不做整类放行；本项目的协程/任务泄漏
# 消息形如 "Exception ignored in: <coroutine object ...>"，不匹配任何一条，
# 因此仍会升级为错误。
# 依据：CI test-postgres 日志（run e5f41ae）枚举出的全部 unraisable 种类——
#   <function AbstractConnection.__del__>（asyncpg 连接，35 次）
#   <function StreamWriter.__del__>（asyncio 流写入器，18 次）
#   <function _SelectorTransport.__del__>（asyncio 传输层，17 次）
#   <socket.socket ...>（Redis 连接套接字，17 行 / 去重后 14 个 laddr）
#   <coroutine object AsyncMockMixin._execute_mock_call>（2 次，本项目真实缺陷，
#    已由 test_codex_bridge.py 的 MagicMock 修复消灭，故不放行）
# 另加两条 pytest 自身在 Windows 清理临时目录时的告警（_pytest/pathlib.py）。
# 消息正则用 . 代替原文冒号（filter 字段以冒号分隔）。
filterwarnings =
    error
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore:Exception ignored in. <function AbstractConnection\.__del__
    ignore:Exception ignored in. <function StreamWriter\.__del__
    ignore:Exception ignored in. <function _SelectorTransport\.__del__
    ignore:Exception ignored in. <socket\.socket
    ignore:Exception ignored in. <nt\.ScandirIterator
    ignore:\(rm_rf\) error removing
