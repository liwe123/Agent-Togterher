[pytest]
# 本地与 CI 对齐（守则 3）：CI 显式传 --timeout=120 --timeout-method=thread
# --session-timeout=900，此处固化同参数，使裸跑 pytest 与 CI 行为一致。
timeout = 120
timeout_method = thread
session_timeout = 900
# 告警门禁：告警默认升级为错误，防止 “coroutine never awaited” 这类真实缺陷
# 再次静默通过（本批即借此抓到 test_integrations.py 的 AsyncMock 误用）。
# 以下放行项全部是第三方/环境噪声，不覆盖本项目代码：
#   1) DeprecationWarning / PendingDeprecationWarning（依赖升级噪声）
#   2) starlette.StarletteDeprecationWarning（继承 UserWarning，TestClient 与
#      httpx 的过渡期提示）
#   3) pytest 在 Windows 清理临时目录时的自身告警：未关闭的 nt.ScandirIterator
#      与 (rm_rf) error removing WinError 145（均为 _pytest/pathlib.py 行为）。
#      消息正则用 . 代替原文冒号（filter 字段以冒号分隔）。
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore:Exception ignored in. <nt\.ScandirIterator
    ignore:\(rm_rf\) error removing
