[alembic]
# %(here)s resolves to the directory containing this ini file, so the
# script location works regardless of the current working directory.
script_location = %(here)s/alembic

# Placeholder; the real URL is injected at runtime by app.db.session
# (from settings.database_url) or by alembic/env.py when invoked from CLI.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
